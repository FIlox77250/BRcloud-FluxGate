# =============================================================================
# BRCloud FluxGate - OWASP CRS Override / Tuning
# =============================================================================
# Inclus par modsecurity.conf ENTRE crs-setup.conf et rules/*.conf : les
# variables tx.* posees ici sont vues par REQUEST-901-INITIALIZATION, qui ne
# fixe ses valeurs par defaut que pour les variables encore absentes.
#
# Identifiants : la plage 900000-999999 est reservee au CRS (crs-setup.conf
# en utilise deja plusieurs : 900000, 900110, 900200...). Une collision fait
# refuser le chargement de toute la configuration par nginx. FluxGate utilise
# la plage 10100-10199.
#
# Copie par scripts/deploy.sh vers /etc/modsecurity/crs/crs-setup-override.conf
# (ALLOWED_METHODS de config.env est applique a la ligne tx.allowed_methods).
# =============================================================================

# --- Paranoia Level ---
# Niveau 1 : regles de base (moins de faux positifs)
# Niveau 2 : regles supplementaires (recommande en production apres tuning)
# Niveau 3-4 : tres restrictif (nombreux faux positifs possibles)
SecAction "id:10100,phase:1,pass,nolog,t:none,setvar:tx.blocking_paranoia_level=1"

# --- Detection Paranoia Level (journalise sans bloquer) ---
SecAction "id:10101,phase:1,pass,nolog,t:none,setvar:tx.detection_paranoia_level=2"

# --- Seuil d'anomalie (scoring mode) ---
# Requete bloquee si score >= seuil
SecAction "id:10102,phase:1,pass,nolog,t:none,setvar:tx.inbound_anomaly_score_threshold=5"
SecAction "id:10103,phase:1,pass,nolog,t:none,setvar:tx.outbound_anomaly_score_threshold=4"

# --- Methodes HTTP autorisees ---
# Le CRS refuse par defaut tout ce qui n'est pas GET HEAD POST OPTIONS
# (regle 911100) : une API REST qui utilise PUT, PATCH ou DELETE doit les
# declarer dans ALLOWED_METHODS (config.env).
SecAction "id:10104,phase:1,pass,nolog,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"

# --- Exclure certains chemins du WAF (health checks, monitoring) ---
SecRule REQUEST_URI "@beginsWith /health" \
    "id:10110,phase:1,pass,nolog,t:none,ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /nginx_status" \
    "id:10111,phase:1,pass,nolog,t:none,ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /server-status" \
    "id:10112,phase:1,pass,nolog,t:none,ctl:ruleEngine=Off"

# --- Exclusions pour faux positifs connus (a adapter selon votre app) ---
# Exemple : exclure un parametre specifique de la detection SQLi
# SecRuleUpdateTargetById 942100 "!ARGS:mon_parametre_safe"

# --- Pas de rate limiting dans le WAF ---
# L'ancienne version comptait les requetes par IP avec initcol/expirevar.
# expirevar etait repose a CHAQUE requete : la fenetre de 60 s glissait
# sans fin et un client regulier finissait bloque en permanence. libmodsecurity
# v3 gere de plus mal les collections persistantes. Le rate limiting est fait
# par NGINX (limit_req, par IP) et nftables (par IP et /64).
