# =============================================================================
# BRCloud FluxGate - CrowdSec Acquisition Configuration
# =============================================================================
# Definit les sources de logs que CrowdSec doit analyser.
# Copier vers /etc/crowdsec/acquis.yaml (ou /etc/crowdsec/acquis.d/)
# =============================================================================

# --- Logs SSH : journal systemd ---
# Debian 12+ et Ubuntu 24.04 n'ont plus de /var/log/auth.log sans rsyslog :
# lire ce fichier ne remontait aucune tentative SSH. Deux filtres sur le
# meme champ sont combines en OU (ssh.service Debian, sshd.service RHEL).
source: journalctl
journalctl_filter:
  - "_SYSTEMD_UNIT=ssh.service"
  - "_SYSTEMD_UNIT=sshd.service"
labels:
  type: syslog
---

# --- Logs NGINX ---
filenames:
  - /var/log/nginx/access.log
  - /var/log/nginx/error.log
labels:
  type: nginx
---

# --- Logs Apache (si utilise a la place de NGINX) ---
filenames:
  - /var/log/apache2/access-timing.log
  - /var/log/apache2/error.log
labels:
  type: apache2
---

# --- Logs nftables (si logging active) ---
filenames:
  - /var/log/nftables.log
labels:
  type: nftables
---

# --- Logs ModSecurity (si WAF active) ---
filenames:
  - /var/log/modsecurity/modsec_audit.log
labels:
  type: modsecurity
---

# --- Logs Caddy (profil Caddy, journal JSON) ---
# Necessite la collection : cscli collections install crowdsecurity/caddy
# (installee par deploy.sh quand Caddy est detecte).
filenames:
  - /var/log/caddy/access.log
labels:
  type: caddy
