# =============================================================================
# BRCloud FluxGate - Action fail2ban : bannir dans les sets FluxGate
# =============================================================================
# L'action nftables standard de fail2ban cree sa propre table (f2b-table) :
# les bans sont invisibles depuis nft-manage.sh et status.sh, et se cumulent
# avec les blocklists FluxGate sans qu'on sache qui a banni quoi.
#
# Cette action ecrit directement dans inet filter blocklist4 / blocklist6,
# les memes sets que le blocage manuel et CrowdSec. Consequence : un seul
# endroit a consulter, et le timeout du set gere l'expiration.
#
# Copier vers /etc/fail2ban/action.d/fluxgate-nft.conf puis, dans une jail :
#   banaction = fluxgate-nft
#
# Prerequis : la table inet filter et ses sets doivent exister (nftables.conf).
# =============================================================================

[Definition]

# Rien a creer/detruire : les sets sont geres par nftables.conf
actionstart =
actionstop  =

# Verifie que le set cible existe avant d'accepter des bans
actioncheck = nft list set inet filter <blockset> >/dev/null 2>&1

# Un bantime <= 0 signifie "permanent" cote fail2ban : dans ce cas on ajoute
# l'element sans timeout, sinon nft refuse la valeur negative.
actionban = if [ "<bantime>" -gt 0 ] 2>/dev/null; then \
                nft add element inet filter <blockset> "{ <ip> timeout <bantime>s }"; \
            else \
                nft add element inet filter <blockset> "{ <ip> }"; \
            fi

# Le || true evite de faire echouer fail2ban si l'element a deja expire seul
actionunban = nft delete element inet filter <blockset> "{ <ip> }" 2>/dev/null || true

[Init]
# Famille par defaut : IPv4
blockset = blocklist4

[Init?family=inet6]
blockset = blocklist6
