# =============================================================================
# BRCloud FluxGate - Action fail2ban : bannir dans les sets FluxGate
# =============================================================================
# L'action nftables standard de fail2ban cree sa propre table (f2b-table) :
# les bans sont invisibles depuis nft-manage.sh et status.sh, et se cumulent
# avec les blocklists FluxGate sans qu'on sache qui a banni quoi.
#
# Cette action ecrit directement dans la table inet fluxgate, dans les memes
# sets que le blocage manuel. Consequence : un seul endroit a consulter, le
# timeout du set gere l'expiration et les bans survivent aux rechargements
# (fluxgate-state.sh).
#
# IPv6 : le ban porte sur le prefixe /64 entier (set blocklist6net). Un
# client IPv6 recoit au moins un /64 : bannir une adresse seule ne l'arrete
# pas, il en change a chaque tentative. Le masquage utilise python3, deja
# requis par fail2ban.
#
# Copier vers /etc/fail2ban/action.d/fluxgate-nft.conf puis, dans une jail :
#   banaction = fluxgate-nft
#
# Prerequis : la table inet fluxgate et ses sets (nftables.conf).
# =============================================================================

[Definition]

# Rien a creer/detruire : les sets sont geres par nftables.conf
actionstart =
actionstop  =

# Verifie que le set cible existe avant d'accepter des bans
actioncheck = nft list set inet fluxgate <blockset> >/dev/null 2>&1

# Un bantime <= 0 signifie "permanent" cote fail2ban : dans ce cas on ajoute
# l'element sans timeout, sinon nft refuse la valeur negative.
actionban = elem=$(<banelem>) || exit 1; \
            if [ "<bantime>" -gt 0 ] 2>/dev/null; then \
                nft add element inet fluxgate <blockset> "{ $elem timeout <bantime>s }"; \
            else \
                nft add element inet fluxgate <blockset> "{ $elem }"; \
            fi

# Le || true evite de faire echouer fail2ban si l'element a deja expire seul
actionunban = elem=$(<banelem>) || exit 0; \
              nft delete element inet fluxgate <blockset> "{ $elem }" 2>/dev/null || true

[Init]
# Famille par defaut : IPv4, adresse seule
blockset = blocklist4
banelem  = echo "<ip>"

[Init?family=inet6]
blockset = blocklist6net
banelem  = python3 -c 'import ipaddress,sys; print(ipaddress.ip_network(sys.argv[1] + "/64", strict=False).network_address)' "<ip>"
