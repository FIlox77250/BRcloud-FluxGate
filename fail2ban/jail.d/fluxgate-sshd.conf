# =============================================================================
# BRCloud FluxGate - Fail2ban Jail : SSH
# =============================================================================
# Protection brute force SSH.
# Copier vers /etc/fail2ban/jail.d/fluxgate-sshd.conf
#
# backend = systemd : Debian 12+ et Ubuntu 24.04 n'installent plus rsyslog,
# /var/log/auth.log n'existe donc pas et une jail basee sur ce fichier
# refuse de demarrer (fail2ban entier s'arrete avec elle). Le journal
# systemd contient toujours les messages de sshd. deploy.sh repasse en
# lecture de fichier si python3-systemd est absent et auth.log present.
# =============================================================================

[sshd]
enabled  = true
port     = ssh
filter   = sshd
backend  = systemd
maxretry = 5
findtime = 600
bantime  = 3600

# Action : bannir via nftables (deploy.sh la remplace par fluxgate-nft si
# F2B_USE_FLUXGATE_SETS=true)
banaction = nftables[type=allports]
