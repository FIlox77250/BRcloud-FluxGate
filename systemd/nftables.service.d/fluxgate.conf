# =============================================================================
# BRCloud FluxGate - Surcharge de nftables.service
# =============================================================================
# Le service Debian vide TOUT le ruleset a l'arret ("nft flush ruleset") :
# un simple "systemctl restart nftables" effacait les tables de Docker,
# CrowdSec ou wg-quick. FluxGate n'occupe que sa table inet fluxgate : c'est
# la seule qu'on retire a l'arret. Le rechargement est atomique (le fichier
# remplace la table en une transaction).
#
# Installe par scripts/deploy.sh dans /etc/systemd/system/nftables.service.d/
# =============================================================================
[Service]
ExecStop=
ExecStop=-/usr/sbin/nft delete table inet fluxgate
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/nftables.conf
